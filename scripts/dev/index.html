<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumos playground</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/client.js"></script>
</head>
<body>
  <main>
    <section class="card setup" aria-label="Create a project">
      <form id="create-form">
        <label>Project name<input name="name" required pattern="[a-z0-9][a-z0-9-]{0,63}" maxlength="64" placeholder="my-lumos-test" autocomplete="off"></label>
        <div class="pair"><label>Framework<select name="framework"><option value="nextjs">Next.js</option><option value="expo">Expo</option></select></label><label>Package manager<select name="packageManager"><option value="pnpm">pnpm</option><option value="npm">npm</option></select></label></div>
        <label id="template-field">Template<select name="template"><option value="notes-app">Basic Notes App</option><option value="bare">Bare</option></select></label>
        <fieldset><legend>Integrations</legend>
          <label class="check"><input type="checkbox" name="components" checked><span id="components-label">shadcn/ui components</span></label>
          <label class="check"><input type="checkbox" name="supabase">Supabase</label>
          <label class="check"><input type="checkbox" name="posthog">PostHog analytics</label>
          <label class="check"><input type="checkbox" name="sentry">Sentry error tracking</label>
        </fieldset>
        <button class="primary" id="create-button" type="submit">Create project <span aria-hidden="true">↗</span></button>
      </form>
      <p id="error" role="alert"></p>
    </section>
    <section class="card explorer" aria-labelledby="files-heading">
      <div class="toolbar"><h2 id="files-heading">Explore files</h2><div class="tools"><select id="projects" aria-label="Project to explore"><option value="">No projects yet</option></select><button id="refresh" type="button">Refresh</button><button id="delete-all" type="button" class="danger" disabled>Delete all projects</button></div></div>
      <p class="muted small location" id="location">Your generated projects will appear here.</p>
      <div class="browser"><nav id="tree" aria-label="File tree"><p class="empty">Create your first project to explore its files.</p></nav><div class="preview"><div id="file-path">File preview</div><pre id="file-content">Select a file to see its contents.</pre></div></div>
    </section>
    <section class="card activity" aria-label="Project commands">
      <div class="toolbar actions">
        <div class="tools"><button id="start-dev" type="button" disabled>Start dev server</button><button id="stop" type="button" disabled>Stop</button></div>
        <div class="tools"><select id="command" aria-label="Project command"></select><button id="run-command" type="button" disabled>Run</button></div>
        <span id="status" role="status"></span><span id="connection" role="status"></span>
      </div>
      <pre id="log" tabindex="0" aria-label="Command output"></pre>
    </section>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-heading">
    <h2 id="delete-heading">Delete all projects?</h2>
    <p>All projects in .playground/ will be permanently deleted.</p>
    <div class="tools"><button id="cancel-delete" type="button">Cancel</button><button id="confirm-delete" class="danger" type="button">Delete all projects</button></div>
  </dialog>
</body>
</html>
